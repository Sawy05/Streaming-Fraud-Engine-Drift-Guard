global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "fraud-serving-onnx"
    metrics_path: /metrics
    static_configs:
      - targets: ["fraud-serving:8000"]

  - job_name: "redpanda-broker"
    metrics_path: /public_metrics
    static_configs:
      - targets: ["redpanda:9644"]
